services:
  - type: web
    name: vega-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://vega-portfolio.onrender.com

  - type: web
    name: vega-portfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://vega-portfolio-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
